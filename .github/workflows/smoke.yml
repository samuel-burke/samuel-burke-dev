name: Deployed smoke test

# Runs the E2E suite against a deployed site: the dev staging preview before a release, production after one.
# Manual on purpose: Cloudflare Pages deploys on its own, so this verifies a deployment rather than gating it.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to test
        required: true
        default: https://dev.samuel-burke-dev.pages.dev

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test deployed site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ inputs.url }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
